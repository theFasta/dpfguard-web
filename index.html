<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPF Guard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #0d0d0d;
    color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 16px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  p.tagline {
    margin: 0 0 32px;
    color: #a0a0a0;
    font-size: 15px;
    line-height: 1.5;
  }
  .links { display: flex; flex-direction: column; gap: 10px; }
  a.btn {
    display: block;
    padding: 14px 20px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    background: #1a1a1a;
    color: #e8e8e8;
    border: 1px solid #2a2a2a;
  }
  a.btn.primary {
    background: #cc0000;
    border-color: #cc0000;
    color: #fff;
  }
  footer {
    margin-top: 32px;
    font-size: 12px;
    color: #666;
  }
  footer a { color: #888; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1>DPF Guard</h1>
    <p class="tagline">
      Monitoraggio del filtro antiparticolato (FAP/DPF) via OBD2,
      pensato per chi guida prevalentemente in città.
    </p>
    <div class="links">
      <a class="btn primary" href="https://play.google.com/store/apps/details?id=it.dpfguard.app">
        Scarica su Google Play
      </a>
      <a class="btn" href="https://thefasta.github.io/public_pages/dpf_guard/dpf_guard_privacy.html">
        Privacy Policy
      </a>
    </div>
    <footer>© 2026 DPF Guard</footer>
  </div>
</body>
</html>
